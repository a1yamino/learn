<script>
/* hub demo: one image's layers, then containers stacking on top — loops slowly, pauses when hidden */
(()=>{const b=document.getElementById('demo'),hr=b.parentNode,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fit=()=>{const r=hr.getBoundingClientRect(),k=Math.min(r.width/600,r.height/600)*.9;b.style.transform=`translate(-50%,-50%) scale(${k})`};b.style.position='absolute';b.style.left='50%';b.style.top='50%';b.style.transformOrigin='center';addEventListener('resize',fit);fit();
const mk=(t,c,w,x,y)=>{const n=document.createElement('div');n.className='el blk '+c;n.style.width=w+'px';n.style.height='44px';n.textContent=t;n.dataset.x=x;n.dataset.y=y;n.style.transform=`translate(${x}px,${y+14}px)`;n.style.opacity=0;b.appendChild(n);return n};
const L=[mk('FROM python:3.12-slim','dim',420,90,420),mk('RUN pip install','dim',420,90,370),mk('COPY app.py','dim',420,90,320)],W=[mk('容器 1','hatch',132,90,270),mk('容器 2','hatch',132,234,270),mk('容器 3','hatch',132,378,270)],all=[...L,...W];
const cap=document.createElement('div');cap.className='el tag';cap.style.width='420px';cap.style.transform='translate(90px,490px)';cap.innerHTML='<b>镜像</b> 3 个只读层 · <b>容器</b> 各加 1 层可写层';b.appendChild(cap);
const show=(n,on)=>{n.style.opacity=on?1:0;n.style.transform=`translate(${n.dataset.x}px,${+n.dataset.y+(on?0:-10)}px)`};
if(RM){all.forEach(n=>show(n,1));return}
let t=0,on=true;new IntersectionObserver(([e])=>on=e.isIntersecting).observe(hr);
setInterval(()=>{if(!on||document.hidden)return;t=(t+1)%10;all.forEach((n,i)=>show(n,i<t-0));if(t===0)all.forEach(n=>show(n,0))},900)})();
</script></body></html>
