name: learn-docker
services:
  api:
    image: ${LAB_IMAGE:-learn-docker-api:1.0.0}
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    environment:
      BIND_HOST: 0.0.0.0
      PORT: "8000"
      DATA_DIR: /data
    volumes:
      - orders:/data
    networks:
      - back
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=1)"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${LAB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - front
      - back
    depends_on:
      api:
        condition: service_healthy
networks:
  front:
  back:
volumes:
  orders:
